<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bryan | Service Delivery Manager</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    background: #ffffff;
    border-radius: 16px;
    max-width: 480px;
    width: 100%;
    padding: 48px 40px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    text-align: center;
  }

  .avatar {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    font-weight: 600;
    margin: 0 auto 24px;
  }

  h1 {
    font-size: 26px;
    color: #0f172a;
    margin-bottom: 6px;
  }

  .role {
    font-size: 16px;
    color: #2563eb;
    font-weight: 600;
    margin-bottom: 24px;
  }

  .divider {
    width: 40px;
    height: 3px;
    background: #2563eb;
    margin: 0 auto 24px;
    border-radius: 2px;
  }

  .description {
    font-size: 15px;
    color: #475569;
    line-height: 1.6;
    margin-bottom: 32px;
  }

  .contact-line {
    font-size: 14px;
    color: #64748b;
    padding-top: 24px;
    border-top: 1px solid #e2e8f0;
  }

  .contact-line strong {
    color: #0f172a;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="avatar">B</div>
    <h1>Bryan</h1>
    <div class="role">Service Delivery Manager</div>
    <div class="divider"></div>
    <p class="description">
      I keep service delivery running smoothly — managing client relationships,
      overseeing SLAs, and making sure the work gets done right, on time, every time.
    </p>
    <div class="contact-line">
      Got something on your mind? <strong>Reach out — I'm happy to talk it through.</strong>
    </div>
  </div>
</body>
</html>
